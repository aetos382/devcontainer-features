# This workflow is managed by gh actions-lock.

name: "Test a Feature"
on:
  workflow_call:
    inputs:
      feature:
        description: "The ID of the Feature to test, or _global for the scenarios in test/_global."
        type: string
        required: true
      # There is no default: a default would silently extend every Feature to an architecture added
      # to it later, including Features whose upstream has no build for it.
      architectures:
        description: 'The architectures to test on, as a JSON array such as ["amd64", "arm64"].'
        type: string
        required: true

permissions:
  contents: read

env:
  # Pinned for the same reason as baseImage below: a CLI release that changes how tests run would
  # otherwise block every pull request. Renovate proposes the bumps.
  # renovate: datasource=npm depName=@devcontainers/cli
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  # Checks the inputs and pairs each architecture with a native runner of that architecture.
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Inputs are passed through the environment rather than expanded into the script, so that they
      # can never be interpreted as shell code.
      - name: "Check the inputs and choose the runners"
        id: targets
        env:
          FEATURE: ${{ inputs.feature }}
          ARCHITECTURES: ${{ inputs.architectures }}
          # The runner for each architecture, as listed in the "Architectures" table of
          # supported-platforms.md in the dev-container-feature-development plugin.
          RUNNERS: |
            {
              "amd64": "ubuntu-24.04",
              "arm64": "ubuntu-24.04-arm"
            }
        run: |
          set -euo pipefail
          if [ "${FEATURE}" = '_global' ]; then
            if [ ! -f test/_global/scenarios.json ]; then
              echo '::error::There are no global scenarios to test: test/_global/scenarios.json is missing.'
              exit 1
            fi
          elif [ ! -f "src/${FEATURE}/devcontainer-feature.json" ]; then
            echo "::error::'${FEATURE}' is not a Feature of this repository: src/${FEATURE}/devcontainer-feature.json is missing."
            exit 1
          fi
          # Slurped, so that several JSON values in a row are rejected instead of being checked one by
          # one.
          if ! jq -e -s 'length == 1 and (.[0] | type == "array" and length > 0 and all(type == "string"))' <<< "${ARCHITECTURES}" >/dev/null 2>&1; then
            echo "::error::The architectures of '${FEATURE}' must be a non-empty JSON array of strings, not '${ARCHITECTURES}'."
            exit 1
          fi
          if ! jq -e 'length == (unique | length)' <<< "${ARCHITECTURES}" >/dev/null; then
            echo "::error::The architectures of '${FEATURE}' list an architecture more than once: ${ARCHITECTURES}"
            exit 1
          fi
          unknown="$(jq -r --argjson runners "${RUNNERS}" '.[] | select(. as $arch | $runners | has($arch) | not)' <<< "${ARCHITECTURES}")"
          if [ -n "${unknown}" ]; then
            echo "::error::The architectures of '${FEATURE}' include ones this workflow does not test: $(printf '%s' "${unknown}" | paste -sd ' ' -). Supported: $(jq -r 'keys_unsorted | join(" ")' <<< "${RUNNERS}")."
            exit 1
          fi
          targets="$(jq -c --argjson runners "${RUNNERS}" 'map({arch: ., runner: $runners[.]})' <<< "${ARCHITECTURES}")"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          echo "Targets: ${targets}"

  autogenerated:
    name: "autogenerated (${{ matrix.target.arch }}, ${{ matrix.baseImage }})"
    needs: targets
    if: inputs.feature != '_global'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
        # Pinned to explicit releases and to digests rather than floating tags: ci-passed in ci.yml
        # gates the main branch ruleset, so an image that moves to a new release, or is rebuilt under
        # the same tag, would block every pull request, not just surface a warning. Changing a tag is
        # therefore a deliberate change. Renovate refreshes the digests in a pull request of its own
        # (renovate.json), so a rebuilt image that breaks a feature fails only there. Renovate
        # matches only entries that carry a digest, so add a new image with its digest. Each digest
        # is that of the multi-platform index, so that it resolves on every architecture tested.
        baseImage:
          - debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
          - debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
          - ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
          - mcr.microsoft.com/devcontainers/base:3-ubuntu24.04@sha256:21e9e3275736cb3bc33a2904b279a2ab292c51fedd53c2963463627d4586c3e6
          - mcr.microsoft.com/devcontainers/base:3-ubuntu26.04@sha256:91eff046d5c12318fc98e59258982b87ba896c467427ed8b5dab5a02107a5db7
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Testing '${{ inputs.feature }}' on ${{ matrix.target.arch }} against '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ inputs.feature }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f "${FEATURE}" -i "${BASE_IMAGE}" .

  scenarios:
    name: "scenarios (${{ matrix.target.arch }})"
    needs: targets
    if: inputs.feature != '_global'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Testing '${{ inputs.feature }}' scenarios on ${{ matrix.target.arch }}"
        env:
          FEATURE: ${{ inputs.feature }}
        run: devcontainer features test -f "${FEATURE}" --skip-autogenerated --skip-duplicated .

  global:
    name: "global (${{ matrix.target.arch }})"
    needs: targets
    if: inputs.feature == '_global'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Testing global scenarios on ${{ matrix.target.arch }}"
        run: devcontainer features test --global-scenarios-only .
