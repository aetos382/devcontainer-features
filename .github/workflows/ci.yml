name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned for the same reason as baseImage below: a CLI release that changes how tests run would
  # otherwise block every pull request. Renovate proposes the bumps.
  # renovate: datasource=npm depName=@devcontainers/cli
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - apt-mirror
          - claude-code
          - locale
          - op
          - shellcheck
          - timezone
        # Pinned to explicit releases and to digests rather than floating tags: ci-passed below
        # gates the main branch ruleset, so an image that moves to a new release, or is rebuilt
        # under the same tag, would block every pull request, not just surface a warning. Changing
        # a tag is therefore a deliberate change. Renovate refreshes the digests in a pull request
        # of its own (renovate.json), so a rebuilt image that breaks a feature fails only there.
        # Renovate matches only entries that carry a digest, so add a new image with its digest.
        baseImage:
          - debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
          - debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
          - ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
          - mcr.microsoft.com/devcontainers/base:3-ubuntu24.04@sha256:92164bd01e0a8578ac68ccd4466a472fee8dde530d25741a377487f545884bd5
          - mcr.microsoft.com/devcontainers/base:3-ubuntu26.04@sha256:0b997af705ff88f10e3293326dce61b4a9676b9f98de6aad67f1973691737dd8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - apt-mirror
          - claude-code
          - locale
          - op
          - shellcheck
          - timezone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners, so no setup step is needed.
      # The version therefore follows the runner image and is not pinned like the actions above; a
      # bump can surface new findings on a pull request that did not touch any script.
      #
      # Scripts are collected from git rather than listed here, so that adding one needs no change to
      # this workflow. Selection is by the .sh extension, which every script in the repository has;
      # the git hook can carry it too because .gitconfig names the file explicitly instead of relying
      # on git's fixed hook file names. A script without the extension is silently out of scope, so
      # keep the extension rather than widening the pathspec. The file list is printed because
      # ShellCheck says nothing on success, which would otherwise make "checked everything, all
      # clean" indistinguishable from "checked almost nothing" in this log.
      #
      # ShellCheck runs with its default rule set. The optional checks (shellcheck --list-optional)
      # stay off; SC1091 and SC2016 are suppressed at the few call sites that need it, so that the
      # same rules stay in force everywhere else.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell script matched the pathspec. The file selection is broken." >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # The only status check that the main branch ruleset requires. The results of all other jobs are
  # aggregated here, so that the ruleset needs no change whenever a job is added or renamed.
  # Add every new job to needs. A job that is missing there does not block a merge when it fails.
  # Do not rename this job: the ruleset refers to it by this ID.
  ci-passed:
    # When a job in needs fails, this job is skipped by default, and a skipped job satisfies a
    # required check. always() makes it run, so that it can fail here instead.
    if: always()
    needs:
      - test-autogenerated
      - test-scenarios
      - validate
      - shellcheck
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "Check the results of all jobs"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::Not all jobs succeeded." >&2
            exit 1
          fi
