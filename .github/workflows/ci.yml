# This workflow is managed by gh actions-lock.

# Do not edit, move, or remove the next line. The dev-container-feature-development plugin
# recognizes the workflow it manages by that line, whatever the name of this file.
# dev-container-feature-development: ci
name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per Feature under src/, named test-<id>, that calls test-feature.yaml with the Feature's ID
  # and the architectures to test it on. Add every one of them to needs of ci-passed below.
  #
  # When test/_global/scenarios.json exists, a job named test-global does the same with the feature
  # _global and the architectures that every Feature used by the global scenarios supports.
  test-apt-mirror:
    uses: ./.github/workflows/test-feature.yaml
    with:
      feature: apt-mirror
      architectures: '["amd64", "arm64"]'

  test-claude-code:
    uses: ./.github/workflows/test-feature.yaml
    with:
      feature: claude-code
      architectures: '["amd64", "arm64"]'

  test-locale:
    uses: ./.github/workflows/test-feature.yaml
    with:
      feature: locale
      architectures: '["amd64", "arm64"]'

  test-op:
    uses: ./.github/workflows/test-feature.yaml
    with:
      feature: op
      architectures: '["amd64", "arm64"]'

  test-shellcheck:
    uses: ./.github/workflows/test-feature.yaml
    with:
      feature: shellcheck
      architectures: '["amd64", "arm64"]'

  test-timezone:
    uses: ./.github/workflows/test-feature.yaml
    with:
      feature: timezone
      architectures: '["amd64", "arm64"]'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners, so no setup step is needed.
      # The version therefore follows the runner image and is not pinned like the actions above; a
      # bump can surface new findings on a pull request that did not touch any script.
      #
      # Scripts are collected from git rather than listed here, so that adding one needs no change to
      # this workflow. Selection is by the .sh extension, which every script in the repository has;
      # the git hook can carry it too because .gitconfig names the file explicitly instead of relying
      # on git's fixed hook file names. A script without the extension is silently out of scope, so
      # keep the extension rather than widening the pathspec. The file list is printed because
      # ShellCheck says nothing on success, which would otherwise make "checked everything, all
      # clean" indistinguishable from "checked almost nothing" in this log.
      #
      # ShellCheck runs with its default rule set. The optional checks (shellcheck --list-optional)
      # stay off; SC1091 and SC2016 are suppressed at the few call sites that need it, so that the
      # same rules stay in force everywhere else.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell script matched the pathspec. The file selection is broken." >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # A mismatch between the workflows and actions.lock, or a lockfile that cannot be read, does not
  # show in the workflows themselves, and the pre-commit hook can be bypassed, so it is stopped here.
  actions-lock:
    runs-on: ubuntu-latest
    # The token is handed to an extension fetched by tag, so it is kept read-only.
    permissions:
      contents: read
    env:
      # Used to fetch the extension and for the GitHub API calls that --verify makes.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Verify actions.lock"
        run: |
          set -euo pipefail
          # Verify with the same version as the dev container.
          source .devcontainer/versions.sh
          # Renovate regenerates actions.lock with constraints.ghActionsLock, so that has to be the
          # same version. The shared Renovate preset updates both, but nothing else checks that they
          # agree.
          constraint="$(jq -r '.constraints.ghActionsLock' renovate.json)"
          if [ "${constraint}" != "${GH_ACTIONS_LOCK_VERSION}" ]; then
            echo "::error::constraints.ghActionsLock in renovate.json (${constraint}) differs from GH_ACTIONS_LOCK_VERSION in .devcontainer/versions.sh (${GH_ACTIONS_LOCK_VERSION})." >&2
            exit 1
          fi
          gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"
          # The exit code alone is not enough: when the GitHub API cannot be reached, the commits
          # are left unverified, which is reported only as a warning finding with exit code 0.
          # Info findings (such as the record of a deleted workflow) are allowed. Checked with v0.1.6.
          status=0
          result="$(gh actions-lock --no-fix --no-interactive --verify --json=valid,findings)" || status=$?
          printf '%s\n' "${result}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if ! jq -e '.valid == true and all(.findings[]; .severity == "info")' <<<"${result}" >/dev/null; then
            echo "::error::gh actions-lock reported findings, or could not verify the pinned commits." >&2
            exit 1
          fi

  # The only status check that the main branch ruleset requires. The results of all other jobs are
  # aggregated here, so that the ruleset needs no change whenever a job is added or renamed.
  # Add every new job to needs. A job that is missing there does not block a merge when it fails.
  # Do not rename this job: the ruleset refers to it by this ID.
  #
  # Do not edit, move, or remove the next line. The dev-container-feature-development plugin finds
  # this job by that line, which stays directly above the job ID.
  # dev-container-feature-development: aggregate job
  ci-passed:
    # When a job in needs fails, this job is skipped by default, and a skipped job satisfies a
    # required check. always() makes it run, so that it can fail here instead.
    if: always()
    needs:
      - test-apt-mirror
      - test-claude-code
      - test-locale
      - test-op
      - test-shellcheck
      - test-timezone
      - validate
      - shellcheck
      - actions-lock
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "Check the results of all jobs"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::Not all jobs succeeded." >&2
            exit 1
          fi
