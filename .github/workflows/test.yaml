name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - apt-mirror
          - claude-code-persistence
          - locale
          - op
          - timezone
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - apt-mirror
          - claude-code-persistence
          - locale
          - op
          - timezone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  # Aggregates the matrix jobs above into a single check with a stable name, so that the
  # main branch ruleset can require it without naming every matrix combination.
  tests-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-autogenerated
      - test-scenarios
    steps:
      - name: "Check the results of the test jobs"
        run: |
          test '${{ needs.test-autogenerated.result }}' = success \
            && test '${{ needs.test-scenarios.result }}' = success
