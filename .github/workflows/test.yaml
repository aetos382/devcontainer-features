name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned for the same reason as baseImage below: a CLI release that changes how tests run would
  # otherwise block every pull request. Renovate proposes the bumps.
  # renovate: datasource=npm depName=@devcontainers/cli
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - apt-mirror
          - claude-code
          - locale
          - op
          - shellcheck
          - timezone
        # Pinned to explicit releases rather than floating tags: tests-passed below gates the main
        # branch ruleset, so an image moving to a new release under a floating tag would block every
        # pull request, not just surface a warning. Bumping these is therefore a deliberate change.
        baseImage:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - ubuntu:26.04
          - mcr.microsoft.com/devcontainers/base:3-ubuntu24.04
          - mcr.microsoft.com/devcontainers/base:3-ubuntu26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - apt-mirror
          - claude-code
          - locale
          - op
          - shellcheck
          - timezone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  # Aggregates the matrix jobs above into a single check with a stable name, so that the
  # main branch ruleset can require it without naming every matrix combination.
  tests-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-autogenerated
      - test-scenarios
    steps:
      - name: "Check the results of the test jobs"
        run: |
          test '${{ needs.test-autogenerated.result }}' = success \
            && test '${{ needs.test-scenarios.result }}' = success
