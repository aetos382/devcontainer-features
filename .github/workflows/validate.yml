name: "Validate"
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners, so no setup step is needed.
      # The version therefore follows the runner image and is not pinned like the actions above; a
      # bump can surface new findings on a pull request that did not touch any script.
      #
      # Scripts are collected from git rather than listed here, so that adding one needs no change to
      # this workflow. The pathspec covers the .sh extension plus .githooks, which holds extensionless
      # hooks; a script that is neither is silently out of scope, so extend the pathspec when adding
      # one. The file list is printed because ShellCheck says nothing on success, which would
      # otherwise make "checked everything, all clean" indistinguishable from "checked almost
      # nothing" in this log.
      #
      # ShellCheck runs with its default rule set. The optional checks (shellcheck --list-optional)
      # stay off; SC1091 and SC2016 are suppressed at the few call sites that need it, so that the
      # same rules stay in force everywhere else.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh' '.githooks/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell script matched the pathspec. The file selection is broken." >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # Aggregates the jobs above into a single check with a stable name, so that the main branch ruleset
  # can require it without being updated whenever a job is added or renamed here.
  validation-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - shellcheck
    steps:
      - name: "Check the results of the validation jobs"
        run: |
          test '${{ needs.validate.result }}' = success \
            && test '${{ needs.shellcheck.result }}' = success
